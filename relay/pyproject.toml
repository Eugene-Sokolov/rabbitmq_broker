[project]
name = "relay"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "data",
    "faststream[rabbit]>=0.7.7",
    "pydantic-settings>=2.16.1",
]

[project.scripts]
relay = "relay:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
data = { workspace = true }

[dependency-groups]
dev = [
    "aio-pika>=10.1.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
